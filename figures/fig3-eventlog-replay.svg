<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold">Figure 3 — The EventLog is the source of truth; replay re-reads pins</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#555">append-only, ordered RunEvents</text>

  <!-- event tape -->
  <g font-size="11">
    <rect x="40"  y="64" width="118" height="46" fill="#eef3fb" stroke="#39516e"/><text x="99"  y="84" text-anchor="middle">e0 run.started</text>
    <rect x="158" y="64" width="118" height="46" fill="#ffffff" stroke="#39516e"/><text x="217" y="84" text-anchor="middle">e1 node.started</text>
    <rect x="276" y="64" width="138" height="46" fill="#ffffff" stroke="#39516e"/><text x="345" y="80" text-anchor="middle">e2 node.completed</text><text x="345" y="98" text-anchor="middle" fill="#7a4a1f">{pin}</text>
    <rect x="414" y="64" width="138" height="46" fill="#ffffff" stroke="#39516e"/><text x="483" y="80" text-anchor="middle">e3 node.completed</text><text x="483" y="98" text-anchor="middle" fill="#7a4a1f">{pin: tool-out, ts, id}</text>
    <rect x="552" y="64" width="100" height="46" fill="#fbf6ea" stroke="#7a6a1f"/><text x="602" y="80" text-anchor="middle">e4 run.</text><text x="602" y="98" text-anchor="middle">paused</text>
    <rect x="652" y="64" width="108" height="46" fill="#eaf5ec" stroke="#2f5d3a"/><text x="706" y="84" text-anchor="middle">eN run.completed</text>
  </g>

  <!-- fork branch -->
  <line x1="483" y1="110" x2="483" y2="180" stroke="#2f5d3a" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="495" y="150" font-size="11" fill="#2f5d3a">fork(mode: replay) at checkpoint e3</text>
  <rect x="180" y="182" width="600" height="62" rx="6" fill="#f0f5f0" stroke="#2f5d3a"/>
  <text x="480" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d3a">New Run reconstructs e0..e3 by RE-READING the recorded pins</text>
  <text x="480" y="226" text-anchor="middle" font-size="12">it does NOT re-call tools or regenerate ids/timestamps &#8594; deterministic, portable replay</text>

  <text x="400" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-style="italic">Core replay invariant (replay.md): record non-determinism as pins; re-read, never re-resolve.</text>
</svg>
