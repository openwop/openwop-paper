<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="430" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="15" font-weight="bold">Figure 1 — A2A, MCP, and OpenWOP are complementary layers</text>

  <!-- Agents + A2A -->
  <rect x="120" y="60" width="150" height="46" rx="6" fill="#eef3fb" stroke="#39516e"/>
  <text x="195" y="88" text-anchor="middle" font-size="14">Agent A</text>
  <rect x="510" y="60" width="150" height="46" rx="6" fill="#eef3fb" stroke="#39516e"/>
  <text x="585" y="88" text-anchor="middle" font-size="14">Agent B</text>
  <line x1="272" y1="83" x2="508" y2="83" stroke="#333" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
  <text x="390" y="76" text-anchor="middle" font-size="12" fill="#39516e">A2A — delegate / discover (horizontal)</text>

  <!-- MCP vertical to tools -->
  <line x1="160" y1="106" x2="120" y2="168" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="195" y1="106" x2="195" y2="168" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="230" y1="106" x2="270" y2="168" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="300" y="140" font-size="12" fill="#7a4a1f">MCP — tools / context (vertical)</text>
  <rect x="70"  y="170" width="90" height="40" rx="5" fill="#fbf3ea" stroke="#7a4a1f"/><text x="115" y="195" text-anchor="middle" font-size="12">tools</text>
  <rect x="170" y="170" width="90" height="40" rx="5" fill="#fbf3ea" stroke="#7a4a1f"/><text x="215" y="195" text-anchor="middle" font-size="12">resources</text>
  <rect x="270" y="170" width="90" height="40" rx="5" fill="#fbf3ea" stroke="#7a4a1f"/><text x="315" y="195" text-anchor="middle" font-size="12">prompts</text>

  <!-- OpenWOP substrate -->
  <rect x="40" y="250" width="700" height="150" rx="8" fill="#f0f5f0" stroke="#2f5d3a" stroke-width="1.5"/>
  <text x="390" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d3a">OpenWOP — durable client&#8596;host workflow-control boundary</text>
  <rect x="70" y="292" width="640" height="40" rx="6" fill="#ffffff" stroke="#2f5d3a"/>
  <text x="390" y="317" text-anchor="middle" font-size="13">Run:  create &#8594; observe &#8594; interrupt &#8594; resume &#8594; replay / fork</text>
  <text x="390" y="356" text-anchor="middle" font-size="11.5" fill="#333">HostCapabilityDocument &#183; WorkflowDefinition &#183; RunEvent / EventLog &#183; Interrupt / ResumePayload</text>
  <text x="390" y="376" text-anchor="middle" font-size="11.5" fill="#333">Artifact &#183; TraceContext &#183; ConformanceProfile</text>
</svg>
